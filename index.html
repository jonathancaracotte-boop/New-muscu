v class="listrow"><b>${esc(catalog[e.id].name)}</b><p class="muted">${e.rows.filter(r=>r.done).map(r=>`${num(r.kg)} kg × ${r.reps}`).join(' · ')||'Aucune série validée'}</p></div>`).join('')}</details><div class="row"><button class="secondary grow" data-repeat="${i}">Reprendre</button><button class="quiet" data-edithistory="${i}">Modifier</button><button class="danger" data-deletehistory="${i}">Supprimer</button></div></div>`).join(''):'<div class="card empty">Aucune séance enregistrée pour le moment.</div>'}`}

let alarmLast=0,alarmNodes=[],testUntil=0;

document.addEventListener('click',async ev=>{let b=ev.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;enableAudio();if(d.go){if(page==='historyedit'&&historyEdit){if(!confirm('Quitter sans enregistrer les corrections ?'))return;historyEdit=null}if(page==='editor'&&editor){if(!confirm('Quitter sans enregistrer les modifications ?'))return;editor=null}return go(d.go)}if(d.editprogram!==undefined)return openEditor(d.editprogram);if(d.visual){visualMode=d.visual==='muscles'?'muscles':'gesture';return work()}if(d.step!==undefined)return selectStep(+d.step);if(d.edithistory!==undefined)return openHistoryEditor(+d.edithistory);if(d.deletehistory!==undefined){if(confirm('Supprimer définitivement cette séance de ton historique ?')){state.history.splice(+d.deletehistory,1);statId='';save();go('stats')}return}if(historyEdit&&d.hcheck){let [i,j]=d.hcheck.split(':').map(Number),r=historyEdit.draft.exercises[i].rows[j];r.done=!r.done;return editHistory()}if(historyEdit&&d.hremove!==undefined){historyEdit.draft.exercises.splice(+d.hremove,1);return editHistory()}if(historyEdit&&d.hrow){let [i,j]=d.hrow.split(':').map(Number),e=historyEdit.draft.exercises[i];if(e.rows.length>1)e.rows.splice(j,1);return editHistory()}if(historyEdit&&d.haddrow!==undefined){let e=historyEdit.draft.exercises[+d.haddrow];if(e.rows.length<30)e.rows.push({...e.rows.at(-1),done:false});return editHistory()}if(editor&&d.edmove){let [i,k]=d.edmove.split(':').map(Number),j=i+k;if(j>=0&&j<editor.exercises.length)[editor.exercises[i],editor.exercises[j]]=[editor.exercises[j],editor.exercises[i]];return editProgram()}if(editor&&d.edremove!==undefined){editor.exercises.splice(+d.edremove,1);return editProgram()}if(editor&&d.edrow){let [i,k]=d.edrow.split(':').map(Number),e=editor.exercises[i];if(k>0&&e.rows.length<30)e.rows.push({...e.rows.at(-1),done:false});else if(k<0&&e.rows.length>1)e.rows.pop();return editProgram()}if(d.muscle!==undefined){muscle=d.muscle;let old=$('#muscles').scrollLeft;library();$('#muscles').scrollLeft=old;return}if(d.detail!==undefined){selected=+d.detail;detailTab='Anatomie';return go('detail')}if(d.tab){detailTab=d.tab;return detail()}if(d.fav!==undefined){let id=+d.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();return page==='detail'?detail():results()}if(d.check){let [i,j]=d.check.split(':').map(Number),r=state.active[i].rows[j];r.done=!r.done;if(r.done){if(!state.started)state.started=Date.now();let next=recovery(state.active,i);startTimer(next.seconds,next.kind,i+':'+j)}else if(state.timer?.source===i+':'+j){state.timer=null}save();return work()}if(d.addrow!==undefined){let e=state.active[+d.addrow];if(e.rows.length<30){e.rows.push({...e.rows.at(-1),done:false});save();work()}return}if(d.delrow!==undefined){let e=state.active[+d.delrow];if(e.rows.length>1&&(!e.rows.at(-1).done||confirm('Supprimer une série validée ?'))){e.rows.pop();save();work()}return}if(d.remove!==undefined){let e=state.active[+d.remove];if(!e.rows.some(r=>r.done)||confirm('Retirer cet exercice et ses séries validées ?')){state.active.splice(+d.remove,1);state.review=false;save();work()}return}if(d.up!==undefined){let i=+d.up;if(i>0){[state.active[i-1],state.active[i]]=[state.active[i],state.active[i-1]];save();work()}return}if(d.timeadd){if(state.timer){state.timer.end=Math.max(Date.now(),state.timer.end)+1000*+d.timeadd;state.timer.notified=false;save();tick()}return}if(d.program!==undefined){let p=state.programs[+d.program];return launch(p.exercises,p.name)}if(d.deleteprogram!==undefined){if(confirm('Supprimer ce programme ?')){state.programs.splice(+d.deleteprogram,1);state.selectedProgram='preset';save();render()}return}if(d.repeat!==undefined){let h=state.history[+d.repeat];return launch(h.exercises,h.name)}switch(d.action){case 'hsave':if(!commitHistoryEdit())return toast('Un nom et une série réalisée sont nécessaires.');statId='';save();go('stats');toast('Séance corrigée');break;case 'hcancel':if(confirm('Annuler les corrections ?')){historyEdit=null;go('stats')}break;case 'nextstep':{let i=currentStep();if(state.active[i]?.rows.every(r=>r.done))selectStep(i+1);break}case 'skipstep':{let i=currentStep();if(confirm('Passer cet exercice ? Les séries validées seront conservées.'))selectStep(i+1);break}case 'selectedstart':{let p=getSelectedProgram();return launch(p.exercises,p.name)}case 'freestart':return launch([],'Séance libre');case 'preset':{let p=personalProgram();return launch(p.exercises,p.name)}case 'edadd':if(editor){editor.exercises.push(exercise(Number($('#edpick').value)));editProgram()}break;case 'edsave':if(!persistEditor())return toast('Indique un nom et au moins un exercice.');save();go('home');toast('Programme mis à jour');break;case 'canceledit':if(confirm('Quitter sans enregistrer ?')){editor=null;go('home')}break;case 'onlyfav':onlyFav=!onlyFav;library();break;case 'addexercise':{let n=+$('#newsets').value,r=+$('#newreps').value,k=+$('#newkg').value;if(!Number.isInteger(n)||n<1||n>20||!Number.isInteger(r)||r<1||r>999||!Number.isFinite(k)||k<0||k>2000)return toast('Vérifie les séries, répétitions et charges.');state.active.push(exercise(selected,n,r,k));state.currentUid=state.active.at(-1).uid;state.review=false;if(!state.started)state.started=Date.now();save();go('work');toast('Exercice ajouté');break}case 'manualtimer':startTimer();break;case 'skip':state.timer=null;testUntil=0;silenceAlarm();save();tick();break;case 'saveprogram':{let name=prompt('Nom du programme',state.sessionName);if(name?.trim()){state.programs.push({name:name.trim().slice(0,80),exercises:clone(state.active).map(e=>({...e,rows:e.rows.map(r=>({...r,done:false}))}))});save();toast('Programme enregistré')}break}case 'finish':{let c=counts();if(!c.done)return;if(c.done<c.n&&!confirm('Certaines séries ne sont pas validées. Enregistrer uniquement les séries réalisées ?'))return;state.history.unshift({date:Date.now(),name:state.sessionName||'Séance libre',duration:state.started?Date.now()-state.started:0,exercises:clone(state.active)});state.active=[];state.started=null;state.timer=null;state.currentUid=null;state.review=false;state.sessionName='Séance libre';save();go('stats');toast('Séance enregistrée');break}case 'clear':if(confirm('Abandonner la séance sans l’enregistrer ?')){state.active=[];state.started=null;state.timer=null;state.currentUid=null;state.review=false;state.sessionName='Séance libre';save();work()}break;case 'sound':state.settings.sound=!state.settings.sound;save();settings();break;case 'testsound':silenceAlarm();testUntil=Date.now()+10000;updateAlarm();break;case 'ackalarm':acknowledgeAlarm();break;case 'flash':state.settings.flash=!state.settings.flash;save();settings();break;case 'vibrate':state.settings.vibrate=!state.settings.vibrate;save();settings();break;case 'wake':try{if(wake){await wake.release();wake=null;toast('Maintien désactivé')}else{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);toast('Écran maintenu allumé')}}catch{toast('Maintien de l’écran non disponible ici.')}break;case 'export':download(state);break;case 'reset':if(confirm('Effacer toutes les séances, favoris et programmes de cet appareil ?')){state=fresh();save();go('home')}break}});
if(migratePersonalRowing(state))save();render();if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
