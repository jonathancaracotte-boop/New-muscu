<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8fd"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Cockpit Muscu V7</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef4ff;background:#0b1424}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:22px 17px 90px}.muted{color:#9cacc5}.card{background:#172438;border:1px solid #2a3c55;border-radius:18px;padding:17px;margin:13px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px;margin:10px 0}h2{font-size:20px;margin:8px 0}h3{font-size:16px}button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;background:#2888ff;color:white;cursor:pointer}button.secondary{background:#2a3b53}button.green{background:#16ad69}button.danger{background:#793b49}button:disabled{opacity:.45}input,select{background:#0e1929;color:white;border:1px solid #43536a;border-radius:10px;padding:10px;width:100%;font-size:16px}label{font-size:12px;color:#b4c3d9;display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{background:#101c2d;padding:12px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:#a8bad2}.nav{position:fixed;bottom:0;left:0;right:0;background:#101c2d;border-top:1px solid #2d3b50;display:flex;justify-content:center;padding:10px 5px max(10px,env(safe-area-inset-bottom))}.nav button{background:transparent;color:#9aabc3;font-size:12px;padding:9px;flex:1;max-width:130px}.nav button.active{color:#65adff}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#173f55;color:#8ee7ce;font-size:12px}.bar{height:8px;background:#28394e;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#2888ff}.timer{font-size:66px;font-variant-numeric:tabular-nums;text-align:center;font-weight:800;margin:18px 0}.exercise{border-bottom:1px solid #314055;padding:14px 0}.exercise:last-child{border:0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.small{font-size:12px}.space{height:12px}button.wide{width:100%;margin:5px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #34435b}svg{max-width:100%}
:root{color:#172438;background:#f5f8fd;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{background:linear-gradient(180deg,#eaf3ff 0,#f6f9fe 280px,#f6f9fe 100%)}main{padding:22px 16px 112px}h1{font-size:27px;letter-spacing:-.8px}h2{font-size:21px}.muted{color:#748399}.card{background:#fff;border:1px solid #e3eaf4;box-shadow:0 8px 30px #1e41670a;border-radius:22px;padding:18px;margin:14px 0}.stat{background:#f0f6ff;border:1px solid #e5efff;border-radius:15px;padding:16px 8px}.stat strong{font-size:23px;color:#1677e9}.stat span{color:#63748a}.nav{background:#fff;border-top:1px solid #e5eaf3;box-shadow:0 -4px 18px #263e5a0b}.nav button{color:#8996aa;font-size:11px}.nav button.active{color:#0879f7;background:#eaf3ff;border-radius:12px}.pill{background:#e8f4ff;color:#0877df;font-weight:700}.bar{background:#e5ecf5}.bar div{background:#1687ff}button{background:#1687f7;border-radius:14px;min-height:45px}button.secondary{background:#eaf1f9;color:#2e527e}button.green{background:#09b971;color:#fff}button.danger{background:#fff0f1;color:#d74b55}input,select{background:#f7faff;color:#182c47;border:1px solid #dce6f1;border-radius:12px;padding:12px}label{color:#6d7c91}td,th{border-color:#e9eef5}.exercise{border-color:#e9eef5}.timer{color:#fff}.rest-mode{background:radial-gradient(circle at 50% 30%,#153b67,#091a30 75%);border:0;color:#fff;text-align:center;padding:25px 16px}.rest-mode .muted,.rest-mode label{color:#b6cbe6}.rest-mode .pill{background:#244f7d;color:#fff}.rest-mode .timer{width:240px;height:240px;border:12px solid #1b83fb;border-left-color:#24476b;border-bottom-color:#24476b;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:24px auto;font-size:58px;box-shadow:0 0 0 8px #12345c55}.rest-mode button.secondary{background:#1c3e64;color:white}.rest-mode h2{color:#fff}.brand{display:flex;align-items:center;gap:9px;font-weight:850;color:#142c4b;font-size:21px}.brand-icon{background:#e8f2ff;color:#147bfa;padding:10px;border-radius:13px}.hero{background:linear-gradient(125deg,#e8f2ff,#fff);border:1px solid #dcecff}.hero .wide{margin-top:15px}.eyebrow{font-size:11px;letter-spacing:1px;color:#6e8eaf;text-transform:uppercase;font-weight:800}.exercise-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #e9eef5}.exercise-line:last-child{border:0}.exercise-number{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:#e8f3ff;color:#147bfa;border-radius:10px;margin-right:10px;font-weight:800}.chart-wrap{height:180px;display:flex;align-items:end;gap:7px;border-bottom:1px solid #dce6f1;padding:20px 3px 0}.chartbar{flex:1;min-width:8px;background:linear-gradient(#1c89ff,#7fc3ff);border-radius:5px 5px 0 0}.chart-labels{display:flex;justify-content:space-between;color:#7e8da1;font-size:11px;margin-top:8px}.summary-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f6}.summary-row:last-child{border:0}.header-label{color:#72849c;font-size:12px}.num-control{display:flex;align-items:center;gap:7px}.num-control button{min-height:44px;padding:8px 13px;background:#e9f3ff;color:#1687f7}.num-control input{text-align:center;min-width:0;font-weight:800;font-size:23px}.workout-card h2{margin:15px 0}.hint{font-size:12px;color:#8492a4}.section-head{display:flex;align-items:center;justify-content:space-between}.logo-small{color:#167ff1}.bottom-note{font-size:12px;color:#8290a3;margin-top:14px}

</style><style>.v7-visual{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(95px,1fr);gap:9px;margin:16px 0 8px}.v7-motion,.v7-anatomy{background:#f2f7fd;border:1px solid #dce7f4;border-radius:16px;overflow:hidden}.v7-motion svg{width:100%;height:205px;display:block}.v7-anatomy svg{width:100%;height:205px;display:block}.v7-visual-label{font-size:11px;font-weight:750;color:#395b80;text-align:center;padding:0 4px 10px}.v7-muscles{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}.v7-muscles span{border-radius:20px;padding:7px 9px;font-size:11px;font-weight:750}.v7-primary{background:#fff0ed;color:#cb503c}.v7-secondary{background:#eaf3ff;color:#2776ca}@media(max-width:360px){.v7-visual{grid-template-columns:minmax(0,1.8fr) minmax(85px,1fr)}.v7-motion svg,.v7-anatomy svg{height:180px}}</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><script>
const KEY='cockpit_muscu_v2';const SOUND_KEY='cockpit_muscu_sound_v4';let soundMode=localStorage.getItem(SOUND_KEY)||'fort';const defaults=[{name:'Développé couché',sets:4,reps:10,kg:37.5,rest:90,transition:120},{name:'Rowing haltère',sets:3,reps:12,kg:12,rest:75,transition:90},{name:'Élévations latérales',sets:3,reps:15,kg:5,rest:60,transition:90},{name:'Shrugs',sets:3,reps:15,kg:12,rest:60,transition:90},{name:'Curl barre',sets:3,reps:10,kg:24.5,rest:75,transition:0}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}data=data||{program:defaults,history:[],active:null};let tab='home',audio=null,wakeLock=null,wakeStatus='En attente';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const fmt=s=>`${Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')}:${Math.floor(Math.max(0,s)%60).toString().padStart(2,'0')}`;const plan=()=>data.program.flatMap((e,i)=>Array.from({length:e.sets},(_,j)=>({i,j, ...e})));const current=()=>plan()[data.active?.idx||0];const vol=r=>r.reduce((a,x)=>a+x.kg*x.reps,0);function sound(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const patterns={court:[0],fort:[0,.32,.64],insistant:[0,.36,.72,1.08,1.44]};let now=audio.currentTime+.03;patterns[soundMode].forEach((t,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.setValueAtTime(i%2?740:1050,now+t);o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.24,now+t+.018);g.gain.exponentialRampToValueAtTime(.0001,now+t+.24);o.start(now+t);o.stop(now+t+.25)})}catch(e){}if(navigator.vibrate)navigator.vibrate(soundMode==='insistant'?[220,130,220,130,220]:[220,100,220])}
function setSoundMode(v){if(!['court','fort','insistant'].includes(v))return;soundMode=v;localStorage.setItem(SOUND_KEY,v);sound()}
function soundSettings(){return `<div class="card"><h3>🔊 Sonnerie de fin de repos</h3><label for="soundMode">Type d'alerte</label><select id="soundMode" onchange="setSoundMode(this.value)"><option value="court" ${soundMode==='court'?'selected':''}>Courte (1 signal)</option><option value="fort" ${soundMode==='fort'?'selected':''}>Forte (3 signaux)</option><option value="insistant" ${soundMode==='insistant'?'selected':''}>Insistante (5 signaux)</option></select><button class="secondary wide" onclick="sound()">▶ Tester la sonnerie</button><p class="muted small">Le volume maximal dépend d'iOS et de la sortie audio. Augmente le volume de l'iPhone. Le son ne peut pas être garanti écran verrouillé.</p></div>`}
async function enableWakeLock(){
 if(!data.active){wakeStatus='Inactif';return}
 if(!('wakeLock' in navigator)){wakeStatus='Non pris en charge par cet iPhone';updateWakeLabel();return}
 try{if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;wakeStatus='Suspendu';updateWakeLabel()})}wakeStatus='Écran maintenu allumé'}catch(e){wakeStatus='Autorisation indisponible';}updateWakeLabel()
}
async function disableWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}wakeStatus='Inactif';updateWakeLabel()}
function updateWakeLabel(){let el=$('wakeStatus');if(el)el.textContent=wakeStatus}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&data.active)enableWakeLock()});
function nav(){ $('nav').innerHTML=[['home','Accueil'],['workout','Séance'],['program','Programme'],['stats','Statistiques'],['history','Historique']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}function go(t){tab=t;render()}function start(){if(!data.program.length)return;audio=audio||null;sound();data.active={idx:0,phase:'work',results:[],started:new Date().toISOString(),draftReps:plan()[0].reps,draftKg:plan()[0].kg,endAt:null,remaining:0,paused:false};save();enableWakeLock();go('workout')}function finish(){const a=data.active;data.history.unshift({date:new Date().toISOString(),started:a.started,results:a.results,duration:Math.round((Date.now()-new Date(a.started))/60000)});data.active=null;disableWakeLock();save();go('history');setTimeout(()=>{if(confirm('Séance enregistrée ! Souhaites-tu télécharger une sauvegarde JSON maintenant ?'))exportJSON()},150)}function validateSet(){let a=data.active,p=current();let r=Math.max(0,+$('actualReps').value||0),kg=Math.max(0,+$('actualKg').value||0);a.results.push({name:p.name,set:p.j+1,reps:r,kg,target:p.reps});let next=plan()[a.idx+1];if(!next){finish();return}let seconds=next.i===p.i?p.rest:p.transition;a.phase='rest';a.remaining=seconds;a.endAt=Date.now()+seconds*1000;a.paused=false;save();render()}function nextStep(){let a=data.active;if(!a)return;a.idx++;let p=current();if(!p){finish();return}a.phase='work';a.draftReps=p.reps;a.draftKg=p.kg;a.endAt=null;a.remaining=0;save();render()}function pause(){let a=data.active;if(a.paused){a.endAt=Date.now()+a.remaining*1000;a.paused=false}else{a.remaining=Math.max(0,Math.ceil((a.endAt-Date.now())/1000));a.paused=true}save();render()}function adjustRest(v){let a=data.active;a.remaining=Math.max(0,(a.paused?a.remaining:Math.ceil((a.endAt-Date.now())/1000))+v);if(!a.paused)a.endAt=Date.now()+a.remaining*1000;save();render()}function stop(){if(confirm('Abandonner la séance en cours ? Les séries déjà réalisées seront perdues.')){data.active=null;disableWakeLock();save();go('home')}}function tick(){let a=data.active;if(!a||a.phase!=='rest'||a.paused)return;let rem=Math.max(0,Math.ceil((a.endAt-Date.now())/1000));if($('clock'))$('clock').textContent=fmt(rem);if(rem<=0){sound();nextStep()}}setInterval(tick,250);function home(){let n=data.history.length;return `<h1>Mon Cockpit Muscu</h1><p class="muted">Ton programme, ton rythme, ta progression.</p><div class="card"><span class="pill">${data.active?'Séance en cours':'Prêt pour ta séance'}</span><h2>Haut du corps</h2><p class="muted">${data.program.length} exercices · ${plan().length} séries programmées</p><button class="wide" onclick="${data.active?"go('workout')":"start()"}">${data.active?'Reprendre ma séance':'▶ Lancer ma séance complète'}</button></div><div class="grid"><div class="stat"><strong>${n}</strong><span>Séances enregistrées</span></div><div class="stat"><strong>${Math.round(data.history.reduce((a,s)=>a+vol(s.results),0)).toLocaleString('fr-FR')} kg</strong><span>Volume cumulé</span></div></div>${soundSettings()}<div class="card"><h3>Comment ça marche ?</h3><p>1. Prépare ton programme. 2. Valide chaque série après avoir saisi les répétitions réalisées. 3. Le repos démarre automatiquement. 4. Une alerte annonce la suite.</p></div>`}function workout(){let a=data.active;if(!a)return `<h1>Séance</h1><div class="card"><p>Aucune séance en cours.</p><button onclick="start()">Lancer la séance</button></div>`;let p=current(),done=a.results.length,all=plan().length;return `<div class="top"><h1>Séance en cours</h1><button class="danger small" onclick="stop()">Abandonner</button></div><p class="muted">${done} / ${all} séries réalisées</p><div class="card small">☀️ Mode écran allumé : <strong id="wakeStatus">${wakeStatus}</strong><br><button class="secondary" style="margin-top:8px" onclick="enableWakeLock()">Réactiver</button> <button class="secondary" onclick="sound()">Tester le son 🔊</button></div><div class="bar"><div style="width:${done/all*100}%"></div></div><div class="card"><span class="pill">Exercice ${p.i+1}/${data.program.length} · Série ${p.j+1}/${p.sets}</span><h2>${esc(p.name)}</h2>${a.phase==='work'?`<p class="muted">Objectif : ${p.reps} répétitions · ${p.kg} kg</p><div class="grid"><div><label>Répétitions réellement faites</label><input id="actualReps" type="number" min="0" step="1" value="${a.draftReps}" oninput="data.active.draftReps=+this.value;save()"></div><div><label>Charge réelle (kg)</label><input id="actualKg" type="number" min="0" step="0.5" value="${a.draftKg}" oninput="data.active.draftKg=+this.value;save()"></div></div><div class="space"></div><button class="green wide" onclick="validateSet()">✓ Valider la série et lancer le repos</button>`:`<p class="muted">${plan()[a.idx+1]?.i===p.i?'Repos entre séries':'Transition vers le prochain exercice'}</p><div class="timer" id="clock">${fmt(a.paused?a.remaining:Math.ceil((a.endAt-Date.now())/1000))}</div><div class="grid"><button class="secondary" onclick="adjustRest(-15)">− 15 sec</button><button class="secondary" onclick="adjustRest(15)">+ 15 sec</button></div><button class="secondary wide" onclick="pause()">${a.paused?'▶ Reprendre le chrono':'Ⅱ Pause'}</button><button class="wide" onclick="sound();nextStep()">Passer le repos →</button><p class="muted small">Le son est émis quand le chrono atteint zéro si l'application reste active. iOS peut suspendre le son écran verrouillé.</p>`}</div><div class="card"><h3>Résultats déjà enregistrés</h3>${a.results.length?`<table><tr><th>Exercice</th><th>Série</th><th>Rép.</th><th>kg</th></tr>${a.results.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.set}</td><td>${r.reps}</td><td>${r.kg}</td></tr>`).join('')}</table>`:'<p class="muted">Aucune série validée pour le moment.</p>'}</div>`}function program(){return `<div class="top"><h1>Mon programme</h1><button onclick="addExercise()">+ Exercice</button></div><p class="muted">Personnalise ton programme avant de démarrer une séance.</p>${data.program.map((e,i)=>`<div class="card"><div class="top"><h3>${i+1}. ${esc(e.name)}</h3><button class="danger" onclick="removeExercise(${i})">×</button></div><label>Nom de l'exercice</label><input value="${esc(e.name)}" onchange="edit(${i},'name',this.value)"><div class="grid three"><div><label>Séries</label><input type="number" min="1" max="12" value="${e.sets}" onchange="edit(${i},'sets',this.value)"></div><div><label>Rép. cible</label><input type="number" min="1" value="${e.reps}" onchange="edit(${i},'reps',this.value)"></div><div><label>Charge kg</label><input type="number" step="0.5" min="0" value="${e.kg}" onchange="edit(${i},'kg',this.value)"></div></div><div class="grid"><div><label>Repos entre séries (sec)</label><input type="number" min="0" value="${e.rest}" onchange="edit(${i},'rest',this.value)"></div><div><label>Repos après exercice (sec)</label><input type="number" min="0" value="${e.transition}" onchange="edit(${i},'transition',this.value)"></div></div></div>`).join('')}<p class="muted small">Les modifications du programme s'appliquent à la prochaine séance. Évite de modifier le programme pendant une séance active.</p>`}function edit(i,k,v){data.program[i][k]=k==='name'?v:Math.max(k==='sets'||k==='reps'?1:0,+v||0);save()}function addExercise(){data.program.push({name:'Nouvel exercice',sets:3,reps:12,kg:0,rest:90,transition:90});save();render()}function removeExercise(i){if(confirm('Supprimer cet exercice ?')){data.program.splice(i,1);save();render()}}function stats(){let sessions=data.history,all=sessions.flatMap(s=>s.results);let names=[...new Set(all.map(x=>x.name))];return `<h1>Statistiques</h1>${soundSettings()}<div class="grid"><div class="stat"><strong>${sessions.length}</strong><span>Séances</span></div><div class="stat"><strong>${Math.round(vol(all)).toLocaleString('fr-FR')} kg</strong><span>Volume total</span></div><div class="stat"><strong>${all.length}</strong><span>Séries validées</span></div><div class="stat"><strong>${all.length?Math.round(100*all.filter(x=>x.reps>=x.target).length/all.length):0}%</strong><span>Séries à l'objectif</span></div></div><div class="card"><h3>Progression par exercice</h3>${names.length?names.map(n=>{let x=sessions.slice().reverse().map(s=>({date:s.date,rows:s.results.filter(r=>r.name===n)})).filter(z=>z.rows.length);return `<div class="exercise"><strong>${esc(n)}</strong><p class="muted small">Meilleure charge : ${Math.max(...x.flatMap(z=>z.rows.map(r=>r.kg)))} kg · Volume cumulé : ${Math.round(vol(x.flatMap(z=>z.rows)))} kg</p><div class="muted small">${x.slice(-6).map(z=>`${new Date(z.date).toLocaleDateString('fr-FR')}: ${Math.max(...z.rows.map(r=>r.kg))} kg / ${z.rows.reduce((a,r)=>a+r.reps,0)} reps`).join('<br>')}</div></div>`}).join(''):'<p class="muted">Termine une séance pour voir tes premières statistiques.</p>'}</div><button class="secondary wide" onclick="exportCSV()">Exporter mes séries (CSV)</button><button class="secondary wide" onclick="exportJSON()">Sauvegarder toutes mes données (JSON)</button><label for="importFile">Restaurer une sauvegarde JSON</label><input id="importFile" type="file" accept="application/json,.json" onchange="importJSON(this)">`}function history(){return `<h1>Historique</h1>${data.history.length?data.history.map((s,i)=>`<div class="card"><div class="top"><strong>${new Date(s.date).toLocaleString('fr-FR')}</strong><span class="pill">${s.results.length} séries</span></div><p class="muted">${s.duration} min · ${Math.round(vol(s.results)).toLocaleString('fr-FR')} kg de volume</p><details><summary>Voir toutes les séries</summary><table><tr><th>Exercice</th><th>Série</th><th>Rép.</th><th>kg</th></tr>${s.results.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.set}</td><td>${r.reps}</td><td>${r.kg}</td></tr>`).join('')}</table></details></div>`).join(''):'<div class="card"><p class="muted">Ton historique sera disponible après ta première séance.</p></div>'}`}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function exportJSON(){download('cockpit-muscu-sauvegarde.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(){let rows=[['Date','Exercice','Série','Répétitions','Objectif','Charge kg']];data.history.forEach(s=>s.results.forEach(r=>rows.push([s.date,r.name,r.set,r.reps,r.target,r.kg])));download('cockpit-muscu-series.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(el){try{let obj=JSON.parse(await el.files[0].text());if(!Array.isArray(obj.program)||!Array.isArray(obj.history))throw Error('Format incorrect');if(confirm('Remplacer les données locales par cette sauvegarde ?')){data=obj;save();render()}}catch(e){alert('Sauvegarde invalide : '+e.message)}}function render(){nav();$('app').innerHTML=({home,workout,program,stats,history})[tab]()}
function nav(){const icons={home:'⌂',workout:'♧',program:'▦',stats:'▥',history:'◷'};$('nav').innerHTML=[['home','Accueil'],['workout','Séance'],['program','Programme'],['stats','Stats'],['history','Historique']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span style="display:block;font-size:22px;line-height:23px">${icons[id]}</span>${n}</button>`).join('')}
function home(){let n=data.history.length;let volume=Math.round(data.history.reduce((a,s)=>a+vol(s.results),0));return `<div class="brand"><span class="brand-icon">🏋️</span>Cockpit Muscu <span style="margin-left:auto;font-size:12px;color:#8aa0b7">V5</span></div><p class="muted">Ton entraînement, ta progression.</p><div class="card hero"><div class="eyebrow">${data.active?'Séance en cours':'Séance du jour'}</div><h1>Haut du corps</h1><div class="hero-illustration">◉ <span>PROGRAMME PERSONNALISÉ</span></div><p class="muted">${data.program.length} exercices · ${plan().length} séries programmées</p><button class="wide" onclick="${data.active?"go('workout')":"start()"}">${data.active?'▶ Reprendre ma séance':'▶ Démarrer la séance'}</button></div><div class="grid"><div class="stat"><strong>${n}</strong><span>Séances terminées</span></div><div class="stat"><strong>${volume.toLocaleString('fr-FR')} kg</strong><span>Volume cumulé</span></div></div><div class="card"><div class="section-head"><h3>Mon programme</h3><button class="secondary" onclick="go('program')">Modifier</button></div>${data.program.map((e,i)=>`<div class="exercise-line"><div><span class="exercise-number">${i+1}</span><strong>${esc(e.name)}</strong><div class="hint" style="padding-left:44px">${e.sets} séries · ${e.reps} reps · ${e.kg} kg</div></div><span style="color:#1c89ff">›</span></div>`).join('')}</div><div class="card"><h3>Alertes de repos</h3>${soundSettings()}</div>`}

function muscleVisual(name){let n=name.toLowerCase(),bench=n.includes('couch'),row=n.includes('rowing'),shoulder=n.includes('latéral'),curl=n.includes('curl');let label=bench?'PECTORAUX':row?'DOS':shoulder?'ÉPAULES':curl?'BICEPS':'TRAPÈZES';return `<div class="exercise-art"><div class="muscle-tag">${label} · EXERCICE GUIDÉ</div><svg viewBox="0 0 320 180" role="img" aria-label="Illustration stylisée du mouvement ${esc(name)}"><defs><linearGradient id="person" x1="0" x2="1"><stop stop-color="#bdcbdc"/><stop offset="1" stop-color="#7186a1"/></linearGradient></defs><circle cx="162" cy="38" r="19" fill="url(#person)"/><path d="M137 65 Q162 55 187 65 L196 118 Q163 137 127 118 Z" fill="#aebdd0" stroke="#6e829a" stroke-width="3"/><path d="M143 67 Q162 80 181 67 L178 97 Q160 111 146 96 Z" fill="${bench?'#ff735e':row?'#54a5fa':shoulder?'#ffac54':curl?'#74bd9c':'#b287ec'}"/><path d="M131 77 L102 112 L85 107 M192 77 L221 112 L240 107 M145 122 L128 162 M178 122 L198 162" stroke="#7b91aa" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M75 104 L245 104" stroke="#243a55" stroke-width="8" stroke-linecap="round"/><rect x="64" y="88" width="10" height="32" rx="3" fill="#344b68"/><rect x="246" y="88" width="10" height="32" rx="3" fill="#344b68"/><circle cx="73" cy="104" r="23" fill="none" stroke="#263d58" stroke-width="8"/><circle cx="247" cy="104" r="23" fill="none" stroke="#263d58" stroke-width="8"/></svg><span class="art-caption">Illustration indicative · Vérifie la technique du mouvement</span></div>`}

function changeDraft(id,delta){let el=$(id);if(!el)return;el.value=Math.max(0,Math.round((Number(el.value)+delta)*100)/100);el.dispatchEvent(new Event('input'))}
function workout(){let a=data.active;if(!a)return `<h1>Séance</h1><div class="card"><p class="muted">Prêt pour ton entraînement ?</p><button class="wide" onclick="start()">▶ Lancer la séance complète</button></div>`;let p=current(),done=a.results.length,all=plan().length;if(!p)return '';let rest=a.phase==='rest';let n=plan()[a.idx+1];return `<div class="section-head"><div><div class="eyebrow">Entraînement en cours</div><h1>${rest?'Récupération':'Séance en cours'}</h1></div><button class="danger" onclick="stop()">Terminer</button></div><p class="muted">${done} / ${all} séries réalisées</p><div class="bar"><div style="width:${done/all*100}%"></div></div><div class="card ${rest?'rest-mode':'workout-card'}"><span class="pill">Exercice ${p.i+1}/${data.program.length} · Série ${p.j+1}/${p.sets}</span><h2>${esc(p.name)}</h2>${!rest?muscleVisual(p.name):''}${rest?`<p class="muted">${n?.i===p.i?'Repos entre deux séries':'Transition vers le prochain exercice'}</p><div class="timer" id="clock">${fmt(a.paused?a.remaining:Math.ceil((a.endAt-Date.now())/1000))}</div><p class="muted">À suivre : ${esc(n?.name||'Fin de séance')} · ${n?.reps||''} répétitions</p><div class="grid"><button class="secondary" onclick="adjustRest(-15)">− 15 s</button><button class="secondary" onclick="adjustRest(15)">+ 15 s</button></div><button class="secondary wide" onclick="pause()">${a.paused?'▶ Reprendre':'Ⅱ Pause'}</button><button class="wide" onclick="nextStep()">Passer le repos →</button>`:`<p class="muted">Objectif : ${p.reps} répétitions · ${p.kg} kg</p><div class="grid"><div><label>Répétitions réalisées</label><div class="num-control"><button onclick="changeDraft('actualReps',-1)">−</button><input id="actualReps" type="number" min="0" step="1" value="${a.draftReps}" oninput="data.active.draftReps=+this.value;save()"><button onclick="changeDraft('actualReps',1)">+</button></div></div><div><label>Charge réelle (kg)</label><div class="num-control"><button onclick="changeDraft('actualKg',-2.5)">−</button><input id="actualKg" type="number" min="0" step="0.5" value="${a.draftKg}" oninput="data.active.draftKg=+this.value;save()"><button onclick="changeDraft('actualKg',2.5)">+</button></div></div></div><p class="bottom-note">Tu peux adapter les répétitions et la charge à chaque série.</p><button class="green wide" onclick="validateSet()">✓ Valider la série et démarrer le repos</button>`}</div><div class="card"><div class="section-head"><strong>Mode entraînement</strong><button class="secondary" onclick="enableWakeLock()">Écran allumé</button></div><p class="muted small">${esc(wakeStatus)} · <a href="#" onclick="sound();return false">Tester la sonnerie 🔊</a></p></div><div class="card"><h3>Séries enregistrées</h3>${a.results.length?a.results.slice(-8).map(r=>`<div class="summary-row"><span>${esc(r.name)} · série ${r.set}</span><strong>${r.reps} × ${r.kg} kg</strong></div>`).join(''):'<p class="muted">Aucune série validée pour le moment.</p>'}</div>`}
function stats(){let sessions=data.history,all=sessions.flatMap(s=>s.results),names=[...new Set(all.map(r=>r.name))],recent=sessions.slice(0,12).reverse(),max=Math.max(1,...recent.map(s=>vol(s.results)));return `<h1>Statistiques</h1><p class="muted">Ton évolution au fil des séances</p><div class="grid"><div class="stat"><strong>${sessions.length}</strong><span>Séances</span></div><div class="stat"><strong>${Math.round(vol(all)).toLocaleString('fr-FR')} kg</strong><span>Volume soulevé</span></div><div class="stat"><strong>${all.length}</strong><span>Séries réalisées</span></div><div class="stat"><strong>${all.length?Math.round(100*all.filter(r=>r.reps>=r.target).length/all.length):0}%</strong><span>Objectifs atteints</span></div></div><div class="card"><h3>Volume par séance</h3>${recent.length?`<div class="chart-wrap">${recent.map(s=>`<div class="chartbar" title="${Math.round(vol(s.results))} kg" style="height:${Math.max(3,100*vol(s.results)/max)}%"></div>`).join('')}</div><div class="chart-labels"><span>Plus ancien</span><span>Plus récent</span></div>`:'<p class="muted">Le graphique apparaîtra après ta première séance.</p>'}</div><div class="card"><h3>Progression par exercice</h3>${names.length?names.map(name=>{let series=sessions.slice().reverse().map(s=>({date:s.date,rows:s.results.filter(r=>r.name===name)})).filter(x=>x.rows.length);let best=Math.max(...series.flatMap(s=>s.rows.map(r=>r.kg)));return `<div class="exercise"><strong>${esc(name)}</strong><p class="muted small">Record de charge : ${best} kg · Volume total : ${Math.round(vol(series.flatMap(s=>s.rows)))} kg</p><div class="chart-wrap" style="height:70px">${series.slice(-12).map(s=>`<div class="chartbar" style="height:${Math.max(5,100*Math.max(...s.rows.map(r=>r.kg))/Math.max(1,best))}%"></div>`).join('')}</div></div>`}).join(''):'<p class="muted">Tes graphiques par exercice apparaîtront après une séance.</p>'}</div><div class="card"><h3>Sauvegarde de tes données</h3><button class="secondary wide" onclick="exportJSON()">↓ Exporter la sauvegarde JSON</button><button class="secondary wide" onclick="exportCSV()">↓ Exporter les séries CSV</button><label>Restaurer une sauvegarde JSON</label><input type="file" accept="application/json,.json" onchange="importJSON(this)"></div>`}
render();if(data.active)enableWakeLock();</script><style id="faithful-v6">

function muscleInfo(name){let n=name.toLowerCase();if(n.includes('couch'))return {type:'bench',main:['Pectoraux'],other:['Triceps','Deltoïdes antérieurs'],spots:['chest','arms']};if(n.includes('rowing'))return {type:'row',main:['Grand dorsal','Rhomboïdes'],other:['Biceps','Trapèzes'],spots:['back','arms']};if(n.includes('latéral'))return {type:'raise',main:['Deltoïdes latéraux'],other:['Trapèzes'],spots:['shoulders']};if(n.includes('shrug'))return {type:'shrug',main:['Trapèzes supérieurs'],other:['Avant-bras'],spots:['traps']};if(n.includes('curl'))return {type:'curl',main:['Biceps'],other:['Brachial','Avant-bras'],spots:['arms']};return {type:'generic',main:['Muscles sollicités'],other:[],spots:[]}}

function exerciseVisual(name){let m=muscleInfo(name);return `<div class="v7-visual"><div class="v7-motion">${movementSVG(name)}<div class="v7-visual-label">Mouvement : ${esc(name)}</div></div><div class="v7-anatomy">${anatomySVG(name)}</div></div><div class="v7-muscles"><span class="v7-primary">● ${m.main.join(' · ')}</span>${m.other.length?`<span class="v7-secondary">○ ${m.other.join(' · ')}</span>`:''}</div>`}

function v6Control(id,label,value,step){return `<div><label>${label}</label><div class="num-control"><button class="secondary" onclick="v6Bump('${id}',-${step})">−</button><input id="${id}" type="number" min="0" step="${step}" value="${value}" oninput="v6Draft('${id}',this.value)"><button class="secondary" onclick="v6Bump('${id}',${step})">+</button></div></div>`}
function v6Draft(id,val){if(data.active){data.active[id==='actualReps'?'draftReps':'draftKg']=Number(val);save()}}
function v6Bump(id,d){let e=$(id);if(!e)return;e.value=Math.max(0,Math.round((Number(e.value)+d)*100)/100);v6Draft(id,e.value)}
function home(){let last=data.history[0];return `<div class="v6-brand">🏋️ Cockpit Muscu <span style="float:right;font-size:17px" onclick="go('program')">⚙</span></div><div class="v6-sub">Ma semaine</div><div class="v6-filters">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((x,i)=>`<button class="${i===new Date().getDay()-1?'selected':''}">${x}</button>`).join('')}</div><div class="v6-hero"><div class="v6-sub">Séance du jour</div><h2>Haut du corps</h2><p class="v6-sub">${data.program.length} exercices · ${plan().length} séries programmées</p><button onclick="${data.active?"go('workout')":"start()"}">▶ ${data.active?'Reprendre la séance':'Démarrer la séance'}</button></div><h3>Mon programme</h3><div class="card">${data.program.map((e,i)=>`<div class="v6-programrow"><div class="thumb">${['🏋️','💪','🙆','🏋️','💪'][i%5]}</div><div class="detail"><b>${esc(e.name)}</b><small>${e.sets} séries · ${e.reps} répétitions · ${e.kg} kg</small></div><span style="color:#8b9aad">›</span></div>`).join('')}</div><div class="v6-kpis"><div class="stat"><strong>${data.history.length}</strong><span>Séances</span></div><div class="stat"><strong>${Math.round(data.history.reduce((s,h)=>s+vol(h.results),0)).toLocaleString('fr-FR')}</strong><span>kg soulevés</span></div><div class="stat"><strong>${last?.duration||0} min</strong><span>Dernière séance</span></div></div>`}
function workout(){let a=data.active;if(!a)return `<div class="v6-heading">Séance</div><div class="card"><p>Aucune séance en cours.</p><button class="wide" onclick="start()">Démarrer la séance</button></div>`;let p=current(),completed=a.results.filter(r=>r.name===p.name);if(a.phase==='rest'){let next=plan()[a.idx+1];return `<div class="card v6-rest"><div style="font-size:22px;font-weight:800">🏋️ Repos</div><p class="muted">Série ${p.j+1}/${p.sets} terminée<br>${esc(p.name)}</p><div class="timer" id="clock">${fmt(a.paused?a.remaining:Math.ceil((a.endAt-Date.now())/1000))}</div><p>Prochaine série</p><h3>${next?esc(next.name):''} · ${next?.kg||0} kg · ${next?.reps||0} reps</h3><div class="grid three"><button class="secondary" onclick="adjustRest(-15)">−15 s</button><button class="secondary" onclick="adjustRest(15)">+15 s</button><button class="secondary" onclick="sound()">🔊 Son</button></div><button class="wide" onclick="pause()">${a.paused?'▶ Reprendre':'Ⅱ Pause'}</button><button class="secondary wide" onclick="nextStep()">Passer le repos →</button><p class="muted small">Écran allumé : ${wakeStatus}. L'alerte sonore dépend des restrictions iOS.</p></div>`}
return `<div class="v6-heading">${esc(p.name)}</div><div class="v6-tabs"><b>Exercice</b><span>Séries</span><span>Historique</span><span>Notes</span></div>${exerciseVisual(p.name)}<div class="card"><b>Séries prévues</b><div class="v6-sub">${p.sets} séries · ${p.reps} répétitions · ${p.kg} kg</div></div><div class="card"><div style="text-align:center;font-weight:800;margin-bottom:10px">Série ${p.j+1} / ${p.sets}</div><div class="v6-step">${v6Control('actualKg','Charge (kg)',a.draftKg,0.5)}${v6Control('actualReps','Répétitions réelles',a.draftReps,1)}</div><div style="margin-top:12px">${Array.from({length:p.sets},(_,i)=>{let r=completed.find(x=>x.set===i+1);return `<div class="v6-set ${i===p.j?'current':''}"><span>Série ${i+1}</span><span>${r?`${r.kg} kg · ${r.reps} reps`:`${p.kg} kg · ${p.reps} reps`}</span><span>${r?'✅':i===p.j?'🔵':'◯'}</span></div>`}).join('')}</div><button class="green wide" onclick="validateSet()">✓ Valider la série et démarrer le repos</button></div><div class="v6-sub" style="text-align:center">${a.results.length} / ${plan().length} séries validées</div><button class="danger wide" onclick="stop()">Terminer sans enregistrer</button>`}
function v6Filtered(){let n=Number(v6Period),cut=n?Date.now()-n*86400000:0;return data.history.filter(s=>new Date(s.date).getTime()>=cut)}
function v6Line(vals){if(vals.length===0)return '<p class="v6-sub">Graphique disponible après les premières séances.</p>';let max=Math.max(1,...vals),min=Math.min(0,...vals),pts=vals.map((v,i)=>`${25+(i*315/Math.max(1,vals.length-1))},${185-(v-min)/(max-min||1)*145}`).join(' ');return `<svg class="v6-svg" viewBox="0 0 365 210" role="img" aria-label="Évolution des charges"><g stroke="#e5edf6" stroke-width="1">${[40,80,120,160].map(y=>`<line x1="20" y1="${y}" x2="350" y2="${y}"/>`).join('')}</g><polyline fill="none" stroke="#087cff" stroke-width="3" points="${pts}"/>${pts.split(' ').map(p=>{let [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#087cff"/>`}).join('')}</svg>`}
function v6SelectExercise(v){v6Exercise=v;render()}
function v6SetPeriod(v){v6Period=v;render()}
function stats(){let sessions=v6Filtered(),all=sessions.flatMap(s=>s.results),recent=sessions.slice(0,15).reverse(),max=Math.max(1,...recent.map(s=>vol(s.results))),names=[...new Set(data.history.flatMap(s=>s.results.map(r=>r.name)))];if(!v6Exercise)v6Exercise=names[0]||data.program[0]?.name||'';let series=sessions.slice().reverse().map(s=>s.results.filter(r=>r.name===v6Exercise)).filter(r=>r.length),weights=series.map(r=>Math.max(...r.map(x=>x.kg)));return `<div class="v6-heading">📈 Statistiques</div><div class="v6-filters">${[['7','7 j'],['30','30 j'],['90','3 mois'],['365','1 an'],['0','Tout']].map(([v,t])=>`<button class="${v6Period===v?'selected':''}" onclick="v6SetPeriod('${v}')">${t}</button>`).join('')}</div><div class="v6-kpis"><div class="stat"><strong>${sessions.length}</strong><span>Séances</span></div><div class="stat"><strong>${Math.round(vol(all)).toLocaleString('fr-FR')}</strong><span>kg soulevés</span></div><div class="stat"><strong>${sessions.length?Math.round(sessions.reduce((s,x)=>s+(x.duration||0),0)/sessions.length):0} min</strong><span>Durée moy.</span></div></div><div class="card"><h3>Volume d'entraînement</h3><p class="v6-sub">Poids total soulevé (kg)</p>${recent.length?`<div class="v6-chart">${recent.map(s=>`<div title="${Math.round(vol(s.results))} kg" style="height:${Math.max(4,vol(s.results)/max*100)}%"></div>`).join('')}</div><div class="row v6-sub"><span>Plus ancien</span><span>Plus récent</span></div>`:'<p class="v6-sub">Les barres apparaîtront après ta première séance.</p>'}</div><div class="card"><h3>Évolution des charges</h3><select onchange="v6SelectExercise(this.value)">${[...new Set([...data.program.map(e=>e.name),...names])].map(n=>`<option ${n===v6Exercise?'selected':''}>${esc(n)}</option>`).join('')}</select>${v6Line(weights)}<div class="v6-kpis"><div class="stat"><strong>${weights.length?Math.max(...weights):0} kg</strong><span>Charge max</span></div><div class="stat"><strong>${series.reduce((s,r)=>s+vol(r),0).toLocaleString('fr-FR')}</strong><span>Volume</span></div><div class="stat"><strong>${series.length}</strong><span>Séances</span></div></div></div><div class="card"><h3>Mes données</h3><button class="secondary wide" onclick="exportJSON()">↓ Sauvegarder en JSON</button><button class="secondary wide" onclick="exportCSV()">↓ Exporter en CSV</button><label>Importer une sauvegarde</label><input type="file" accept=".json" onchange="importJSON(this)"></div>`}
function nav(){$('nav').innerHTML=[['home','⌂','Accueil'],['workout','♧','Séance'],['program','▦','Programmes'],['stats','▥','Stats'],['history','◷','Historique']].map(([id,ico,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span style="display:block;font-size:20px">${ico}</span>${n}</button>`).join('')}
render();
</script></body></html>
